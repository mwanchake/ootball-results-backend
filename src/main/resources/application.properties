spring.application.name=footbal-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true



# Comma-separated list of top leagues (used to prioritize results and ordering)
# Example:
# app.topLeagues=premier league,la liga,serie a,bundesliga,ligue 1
# If empty or missing, the repository will fall back to a built-in default list.
# app.topLeagues=

